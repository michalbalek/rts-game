<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f160e">
  <title>Království | Izometrická RTS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f160e'/%3E%3Cpath d='M32 10l18 8v14c0 12-8 20-18 24-10-4-18-12-18-24V18z' fill='%23d9a441'/%3E%3Cpath d='M32 20v18M23 29h18' stroke='%231f160e' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Herní plátno -->
  <div id="game-shell">
    <canvas id="game-canvas"></canvas>
  </div>

  <!-- Herní HUD -->
  <div id="hud" class="hidden">
    <header class="hud-top" aria-label="Přehled panství" data-i18n-aria-label="Přehled panství">
      <div class="hud-brand" title="Království" data-i18n-title="Království">
        <div class="crusader-crest" aria-hidden="true"><span class="crest-cross">✠</span></div>
        <div class="hud-brand-text">
          <h1 data-i18n="KRÁLOVSTVÍ">KRÁLOVSTVÍ</h1>
        </div>
      </div>

      <div class="hud-resources" role="group" aria-label="Zásoby panství" data-i18n-aria-label="Zásoby panství">
        <div class="res-card" title="Peníze v královské pokladně" data-i18n-title="Peníze v královské pokladně">
          <span class="res-icon">🪙</span>
          <div class="res-info">
            <span class="res-label" data-i18n="PENÍZE">PENÍZE</span>
            <span class="res-value" id="res-money">0</span>
          </div>
        </div>
        <div class="res-card" title="Dřevo ve skladu" data-i18n-title="Dřevo ve skladu">
          <span class="res-icon">🪵</span>
          <div class="res-info">
            <span class="res-label" data-i18n="DŘEVO">DŘEVO</span>
            <span class="res-value" id="res-wood">0</span>
          </div>
        </div>
        <div class="res-card" title="Kámen ve skladu" data-i18n-title="Kámen ve skladu">
          <span class="res-icon">🪨</span>
          <div class="res-info">
            <span class="res-label" data-i18n="KÁMEN">KÁMEN</span>
            <span class="res-value" id="res-stone">0</span>
          </div>
        </div>
        <div class="res-card" title="Jídlo v sýpce" data-i18n-title="Jídlo v sýpce">
          <span class="res-icon">🍎</span>
          <div class="res-info">
            <span class="res-label" data-i18n="JÍDLO">JÍDLO</span>
            <span class="res-value" id="res-food">0</span>
          </div>
        </div>
        <div class="res-card" title="Železná ruda ve skladu" data-i18n-title="Železná ruda ve skladu">
          <span class="res-icon">⛓️</span>
          <div class="res-info">
            <span class="res-label" data-i18n="ŽELEZO">ŽELEZO</span>
            <span class="res-value" id="res-iron">0</span>
          </div>
        </div>
      </div>

      <div class="hud-status" role="group" aria-label="Kapacity panství" data-i18n-aria-label="Kapacity panství">
        <div class="storage-chips">
          <div class="storage-chip" title="Obsazenost skladu dřevem, kamenem a železem" data-i18n-title="Obsazenost skladu dřevem, kamenem a železem">
            <span aria-hidden="true">📦</span>
            <div class="res-info"><span class="res-label" data-i18n="SKLAD">SKLAD</span><b id="store-value">0/500</b></div>
          </div>
          <div class="storage-chip" title="Obsazenost sýpky" data-i18n-title="Obsazenost sýpky">
            <span aria-hidden="true">🌾</span>
            <div class="res-info"><span class="res-label" data-i18n="SÝPKA">SÝPKA</span><b id="food-store-value">0/300</b></div>
          </div>
        </div>
        <div class="population-badge" title="Počet poddaných a kapacita panství" data-i18n-title="Počet poddaných a kapacita panství">
          <span aria-hidden="true">👥</span>
          <div class="res-info"><span class="res-label" data-i18n="OBYVATELÉ">OBYVATELÉ</span><b id="pop-value">20/20</b></div>
        </div>
      </div>

      <div class="hud-controls">
        <span id="speed-indicator" class="speed-indicator hidden" title="Rychlost hry (+ / −)" data-i18n-title="Rychlost hry (+ / −)">1×</span>
        <span id="fps-counter" class="fps-counter hidden">0 FPS</span>
        <button id="menu-button" class="hud-menu-btn" type="button" title="Herní menu (ESC)" data-i18n-title="Herní menu (ESC)">
          <span aria-hidden="true">☰</span> Menu <kbd>Esc</kbd>
        </button>
      </div>
    </header>

    <div id="connection-banner" class="connection-banner hidden"></div>
    <div id="game-countdown" class="game-countdown hidden"></div>
    <div id="build-banner" class="build-banner hidden"></div>
    <div id="toast-root" class="toast-root"></div>

    <footer class="hud-bottom">
      <section id="selection-panel" class="selection-panel"></section>
      <section id="build-dock" class="build-dock"></section>
      <aside class="minimap-panel">
        <div class="minimap-frame">
          <canvas id="minimap-canvas" width="256" height="256" title="Minimapa - kliknutím přesunete kameru" data-i18n-title="Minimapa - kliknutím přesunete kameru"></canvas>
        </div>
        <div id="minimap-info" class="minimap-info hidden"></div>
      </aside>
    </footer>
  </div>

  <!-- Menu -->
  <div id="menu-root" class="menu-root"></div>

  <!-- Modální okna -->
  <div id="modal-root"></div>

  <noscript>
    <div class="noscript">Království vyžaduje zapnutý JavaScript.</div>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
